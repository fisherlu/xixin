name: xixin
description: "息心 — 中文原生正念冥想与呼吸训练"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  just_audio: ^0.9.36
  wakelock_plus: ^1.1.4
  flutter_local_notifications: ^17.0.0
  confetti: ^0.7.0
  lottie: ^3.0.0
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/meditations/
    - assets/audio/sleep_stories/
    - assets/audio/ambient/
    - assets/scripts/
    - assets/fonts/
